<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PopChats | Login</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" type="image/png" href="static/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="center-mode">
    <nav class="nav">
        <div class="container">
            <a href="rooms.html" class="logo">Pop<span>Chats</span></a>
        </div>
    </nav>

    <div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome</h2>
            <p>Just Enter any Username you like and join the conversation!<br>You will be joining <b id='room'></b> now!</p><br>
        </div>

        <form id="login-form" class="auth-form">
            <div class="input-group">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" name="username" placeholder="e.g. ghost_user" required>
                
                <div id="error-message" class="error-popup" style="color: #ff4444; margin-bottom: 10px; font-size:10px; display:none;"></div>
                
                <button type="submit" class="primary-btn">Join Chat!</button>

                <div class="rules-box">
                    <a href="rules.html">Read Chat Rules Before Entering</a>
                </div>

            </div>
        </form>

        <div id="loader" class="loader-container" style="display: none;">
            <div class="pulse-ring"></div>
            <p class="loading-text">Hang Tight! We're getting you in...</p>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container footer-content">

        <img src="static/favicon.png"
             alt="PopChats Logo"
             style="border-radius:16px; margin-bottom:10px;"
             height="40" width="40">

        <div class="footer-main">
            PopChats v1.2
        </div>

        <div class="footer-credit">
            © 2026 PopChats. All rights reserved.
        </div>

        <div class="footer-credit" style="margin-top:10px;">
            Built with ❤️ by:  
            <a href="https://github.com/NILAY-KS07" target="_blank">
                Nilay Kumar Shrivastava
            </a>
        </div>

        <div class="footer-credit" style="margin-top:10px;">
            <a href="privacy.html">Privacy</a>
            •
            <a href="terms.html">Terms</a>
        </div>

    </div>
</footer>
    
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="static/script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const currentRoom = localStorage.getItem("room") || "public";
    const roomEl = document.getElementById("room");

    if (roomEl) {
        roomEl.innerText = currentRoom.charAt(0).toUpperCase() + currentRoom.slice(1) + " Room";
    }
});
</script>
</body>
</html>
