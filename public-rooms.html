<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="index, follow">

        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PopChats",
        "url": "https://popchats.vercel.app/",
        "description": "Anonymous real-time chat rooms with no signup or tracking."
        }

<body class="rooms-page">

<!-- NAV -->
<div class="nav">
    <div class="container nav-wrapper">
        <a href="rooms.html" class="logo">Pop<span>Chats</span></a>
    </div>
</div>

<!-- MAIN -->
<div class="container rooms-content" style="margin-top:100px;">

    <h2 style="margin-bottom:20px;"><i data-lucide="blocks" style='color:green;'></i>&nbsp; Explore Public Rooms</h2>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="empty-state">
        No Rooms Here Yet!
    </div>

    <!-- ROOMS GRID -->
<div id="roomList" class="grid room-grid"></div>

</div>

<script src="static/script.js"></script>

<script>
async function loadRooms() {
    const list = document.getElementById("roomList");
    const empty = document.getElementById("emptyState");

    try {
        const res = await API("/rooms");
        const data = await res.json();

        list.innerHTML = "";

        if (!data.length) {
            empty.style.display = "flex";
            return;
        }

        empty.style.display = "none";

        data.forEach(room => {
            const div = document.createElement("div");
            div.className = "feature-box";

            div.innerHTML = `
                <h3>${room.name}</h3>
                <p class="room-description">${room.description}</p>
                <p class="room-count">${room.count}/20 users</p>
            `;

            div.onclick = () => {
                window.location.href =
                    `login.html?room=${encodeURIComponent(room.name)}`;
            };

            list.appendChild(div);
        });

    } catch (err) {
        console.error(err);
        empty.innerText = "Failed to load rooms";
    }
}

loadRooms();
</script>
