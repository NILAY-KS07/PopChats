<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms | PopChats</title>

    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" type="image/png" href="static/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body class="rooms-page">

<!-- NAV -->
<div class="nav">
    <div class="container nav-wrapper">
        <a href="index.html" class="logo">Pop<span>Chats</span></a>
    </div>
</div>

<!-- MAIN -->
<div class="container rooms-content" style="margin-top:100px;">

    <h2 style="margin-bottom:20px;">🧩 Explore Public Rooms</h2>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="empty-state">
        No Rooms Here Yet!
    </div>

    <!-- ROOMS GRID -->
<div id="roomList" class="grid room-grid"></div>

</div>

<!-- SCRIPT -->
<script>
const hostname = window.location.hostname;

const isLocal =
  hostname === "localhost" ||
  hostname === "127.0.0.1" ||
  hostname.startsWith("192.168.");

const API_BASE_URL = isLocal
  ? `${window.location.protocol}//${hostname}:5000`
  : "https://popchats.onrender.com";

async function loadRooms() {
    const list = document.getElementById("roomList");
    const empty = document.getElementById("emptyState");

    try {
        const res = await fetch(`${API_BASE_URL}/rooms`);
        const data = await res.json();

        list.innerHTML = "";

        if (!data.length) {
            empty.style.display = "flex";
            return;
        }

        empty.style.display = "none";

        data.forEach(room => {
            const div = document.createElement("div");
            div.className = "feature-box";

            div.innerHTML = `
                <h3>${room.name}</h3>
                <p class="room-description">${room.description}</p>
                <p class="room-count">${room.count}/20 users</p>
            `;

            div.onclick = () => {
                window.location.href = `login.html?room=${room.name}`;
            };

            list.appendChild(div);
        });

    } catch {
        empty.innerText = "Failed to load rooms";
    }
}

loadRooms();
</script>

    <div class="container footer-content">

        <img src="static/favicon.png"

    </div>
</footer>
</body>
</html>
