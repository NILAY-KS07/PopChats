<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - PopChats</title>
    <meta name="description" content="Public and Truly anonymous chatting platform.">
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" type="image/png" href="static/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="error-mode">
<div class="error-background"></div>
<section class="error-wrapper">

    <div class="error-badge">
        404
    </div>

    <h1 class="error-title">
        Oops! This page couldn't be found.
    </h1>

    <p class="error-subtitle">
        The conversation may have expired, the room was removed,
        or the link simply doesn't exist anymore.
    </p>

    <div class="error-actions">
        <a href="index.html" class="primary-btn">
            Return Home
        </a>
    </div>

</section>
</body>
</html>
